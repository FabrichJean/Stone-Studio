{% extends "base.html" %}
{% block content %}
    <div class="studio-view">

      <div id="studioEmpty" class="studio-empty">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon"><svg width="28" height="28" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.7v10.6a.5.5 0 0 0 .77.42l8.4-5.3a.5.5 0 0 0 0-.84l-8.4-5.3a.5.5 0 0 0-.77.42z"/></svg></div>
          <div class="dropzone-title">Glissez votre média ici</div>
          <div class="dropzone-sub">ou <span class="link" id="browseLink">cliquez pour parcourir</span> · <span class="link" id="pickProjectLink">choisir depuis mes projets</span></div>
          <div class="dropzone-hint">MP4, MOV, MP3, WAV et plus</div>
          <input id="fileInput" type="file" accept="video/*,audio/*" hidden />
        </div>
        <div id="projectPicker" class="project-picker" hidden>
          <div class="picker-inline-header">
            <input type="text" id="pickerSearch" placeholder="Rechercher un fichier..." autocomplete="off" />
            <div class="view-toggle" id="pickerViewToggle">
              <button type="button" class="view-toggle-btn" data-view="list" title="Vue liste">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 4.5H13M3 8H13M3 11.5H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
              <button type="button" class="view-toggle-btn" data-view="card" title="Vue cartes">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="9" width="5" height="5" rx="1" fill="currentColor"/></svg>
              </button>
            </div>
            <button type="button" class="picker-back" id="pickerBack">Annuler</button>
          </div>
          <div id="pickerList" class="picker-inline-list"></div>
        </div>
      </div>

      <div id="studioMain" class="studio-main" hidden>
        <div class="studio-topbar">
          <div class="studio-file-info">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M4.5 2h4.5l3 3v9h-7.5z"/><path d="M9 2v3h3"/></svg></span>
            <div>
              <div class="studio-file-name" id="fileName">—</div>
              <div class="studio-file-meta" id="fileMeta"></div>
            </div>
          </div>
          <div class="studio-topbar-actions">
            <button type="button" class="btn-secondary" id="newContentBtn">Nouveau contenu</button>
            <button type="button" class="btn-primary" id="exportBtn" disabled>
              <span class="icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7.5L8 4l3.5 3.5"/><path d="M3 13.5h10"/></svg></span>
              Exporter
            </button>
          </div>
        </div>

        <div class="studio-action-tabs" id="studioActionTabs"></div>

        <div class="studio-body">
          <div class="studio-center">
            <div class="studio-preview">
              <video id="studioVideo"></video>
              <audio id="studioAudio" hidden></audio>
              <div id="previewOverlay" class="studio-preview-overlay" hidden>
                <div class="spinner"></div>
                <span id="previewOverlayLabel">Traitement en cours…</span>
              </div>
            </div>

            <div class="studio-timeline">
              <div class="studio-timeline-header">
                <h3>Timeline de montage</h3>
                <div class="studio-transport">
                  <button type="button" class="transport-btn" id="transportStart" title="Aller au début">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="2.5" y="3" width="1.6" height="10"/><path d="M13 3.2v9.6a.5.5 0 0 1-.77.42l-6.8-4.8a.5.5 0 0 1 0-.84l6.8-4.8a.5.5 0 0 1 .77.42z"/></svg>
                  </button>
                  <button type="button" class="transport-btn transport-play" id="transportPlay" title="Lecture">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.7v10.6a.5.5 0 0 0 .77.42l8.4-5.3a.5.5 0 0 0 0-.84l-8.4-5.3a.5.5 0 0 0-.77.42z"/></svg>
                  </button>
                  <button type="button" class="transport-btn" id="transportEnd" title="Aller à la fin">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="11.9" y="3" width="1.6" height="10"/><path d="M3 3.2v9.6a.5.5 0 0 0 .77.42l6.8-4.8a.5.5 0 0 0 0-.84l-6.8-4.8a.5.5 0 0 0-.77.42z"/></svg>
                  </button>
                  <span class="studio-transport-time" id="transportTime">00:00:00 / 00:00:00</span>
                </div>
              </div>
              <div class="studio-timeline-scroll">
                <div id="timelinePlayhead" class="studio-timeline-playhead" hidden></div>
                <div id="timelineRuler" class="studio-timeline-ruler"></div>
                <div id="timelineTrack" class="studio-timeline-track"></div>
              </div>
            </div>

            <div id="exportProgress" class="progress-wrap" hidden>
              <div class="progress-bar"><div id="exportProgressFill" class="progress-fill"></div></div>
              <div id="exportProgressLabel" class="progress-label"></div>
            </div>
            <div id="exportDone" class="studio-export-done" hidden>
              <button id="downloadBtn" class="btn-primary">
                <span class="icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 7l3.5 3.5L11.5 7"/><path d="M2.5 13h11"/></svg></span>
                Télécharger le résultat
              </button>
              <div id="sendToWrap" class="send-to-wrap" hidden></div>
            </div>
            <div id="studioStatus" class="status"></div>
          </div>

          <div id="studioResizer" class="studio-resizer" title="Glisser pour redimensionner"></div>

          <div class="studio-side" id="studioSide">
            <div id="activeClipBanner" class="studio-active-clip" hidden>
              <div class="studio-active-clip-label">L'action s'applique à</div>
              <div id="panelCropWrap" class="crop-wrap panel-crop-wrap">
                <video id="panelVideo"></video>
                <div id="panelCropOverlay" class="crop-overlay" hidden>
                  <div id="panelCropBox" class="crop-box">
                    <div class="crop-handle" data-handle="nw"></div>
                    <div class="crop-handle" data-handle="ne"></div>
                    <div class="crop-handle" data-handle="sw"></div>
                    <div class="crop-handle" data-handle="se"></div>
                  </div>
                </div>
              </div>
              <audio id="panelAudio" hidden></audio>
              <div class="studio-active-clip-name" id="activeClipName">—</div>
            </div>
            <div id="actionPanel" class="studio-action-panel"></div>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
{% block scripts %}
<script src="{{ static_url('icons.js') }}"></script>
<script src="{{ static_url('common.js') }}"></script>
<script src="{{ static_url('studio.js') }}"></script>
{% endblock %}
