{% extends "base.html" %}
{% block content %}
    <header class="page-header">
      <h1><span class="icon"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 5.8A5 5 0 1 0 13 8"/><path d="M12.8 2.5v3.3h-3.3"/></svg></span> Orientation</h1>
      <p>Faites pivoter ou inversez une vidéo.</p>
    </header>

    <section class="panel trim-panel">
      <div id="dropzone" class="dropzone">
        <div class="dropzone-icon"><svg width="28" height="28" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.7v10.6a.5.5 0 0 0 .77.42l8.4-5.3a.5.5 0 0 0 0-.84l-8.4-5.3a.5.5 0 0 0-.77.42z"/></svg></div>
        <div class="dropzone-title">Glissez votre vidéo ici</div>
        <div class="dropzone-sub">ou <span class="link">cliquez pour parcourir</span> · <span class="link" id="pickProjectLink">choisir depuis mes projets</span></div>
        <div class="dropzone-hint">MP4, MOV, AVI, MKV et plus</div>
        <input id="fileInput" type="file" accept="video/*" hidden />
      </div>

      <div id="projectPicker" class="project-picker" hidden>
        <div class="picker-inline-header">
          <input type="text" id="pickerSearch" placeholder="Rechercher un fichier..." autocomplete="off" />
          <div class="view-toggle" id="pickerViewToggle">
            <button type="button" class="view-toggle-btn" data-view="list" title="Vue liste">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 4.5H13M3 8H13M3 11.5H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="view-toggle-btn" data-view="card" title="Vue cartes">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1" fill="currentColor"/><rect x="2" y="9" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="9" width="5" height="5" rx="1" fill="currentColor"/></svg>
            </button>
          </div>
          <button type="button" class="picker-back" id="pickerBack">Annuler</button>
        </div>
        <div id="pickerList" class="picker-inline-list"></div>
      </div>

      <div id="videoStage" class="video-stage" hidden>
        <video id="preview" controls></video>
      </div>

      <div id="actionsSection" class="params" hidden>
        <h3>Action</h3>
        <div class="orientation-grid">
          <button type="button" class="orientation-btn" data-action="rotate_90_ccw">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 5.8A5 5 0 1 1 3 8"/><path d="M3.2 2.5v3.3h3.3"/></svg>
            <span>Rotation 90° antihoraire</span>
          </button>
          <button type="button" class="orientation-btn" data-action="rotate_90_cw">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 5.8A5 5 0 1 0 13 8"/><path d="M12.8 2.5v3.3h-3.3"/></svg>
            <span>Rotation 90° horaire</span>
          </button>
          <button type="button" class="orientation-btn" data-action="rotate_180">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h12"/><path d="M5 5L2 8l3 3"/><path d="M11 5l3 3-3 3"/></svg>
            <span>Rotation 180°</span>
          </button>
          <button type="button" class="orientation-btn" data-action="flip_horizontal">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v13"/><path d="M4.5 5L2 8l2.5 3"/><path d="M11.5 5L14 8l-2.5 3"/></svg>
            <span>Miroir horizontal</span>
          </button>
          <button type="button" class="orientation-btn" data-action="flip_vertical">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8h13"/><path d="M5 4.5L8 2l3 2.5"/><path d="M5 11.5L8 14l3-2.5"/></svg>
            <span>Miroir vertical</span>
          </button>
        </div>
      </div>

      <button id="applyBtn" class="btn-primary" disabled>
        <span class="icon"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 5.8A5 5 0 1 0 13 8"/><path d="M12.8 2.5v3.3h-3.3"/></svg></span> Appliquer
      </button>
      <div id="status" class="status"></div>
      <div id="info" class="info-list"></div>
    </section>
{% endblock %}
{% block scripts %}
<script src="/static/icons.js"></script>
<script src="/static/common.js"></script>
<script src="/static/orientation.js"></script>
{% endblock %}
