<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e69072"/>
      <stop offset="1" stop-color="#c25e3c"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3ece0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6b2a14" flood-opacity="0.32"/>
    </filter>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Grille d'icône macOS : tuile de 824 px centrée dans 1024, coins arrondis. -->
  <g filter="url(#tile-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#shadow)" fill="url(#star)">
    <path d="M490 230 Q516 486 772 512 Q516 538 490 794 Q464 538 208 512 Q464 486 490 230 Z"/>
    <path d="M714 268 Q720 340 792 346 Q720 352 714 424 Q708 352 636 346 Q708 340 714 268 Z"/>
  </g>
</svg>
